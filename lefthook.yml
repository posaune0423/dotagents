# EXAMPLE USAGE:
#
#   Refer for explanation to following link:
#   https://lefthook.dev/configuration/
#

# `**/*.ts` must also match root files such as eslint.config.ts.
glob_matcher: doublestar

# Pre-commit: Prettier (JS/MD/CSS/JSON), ESLint, and shell format/lint on staged files only.
# Never format or lint the whole tree here: it rewrites untracked skills and live worktrees.
pre-commit:
  parallel: true
  commands:
    format:
      glob: "**/*.{js,jsx,ts,tsx,json,css,md}"
      run: bunx prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    lint:
      glob: "**/*.{js,jsx,ts,tsx}"
      run: bunx eslint --no-warn-ignored {staged_files}
    bash-format:
      glob: "**/*.sh"
      run: shfmt -w {staged_files}
      stage_fixed: true
    bash-lint:
      glob: "**/*.sh"
      run: shellcheck {staged_files}

# Pre-push: ESLint on pushed files and Bash checks (redundant with CI but catches local slips).
# Full-tree runs belong to `just check` and CI; untracked local files must not block a push.
pre-push:
  parallel: true
  commands:
    lint:
      glob: "**/*.{js,jsx,ts,tsx}"
      run: bunx eslint --no-warn-ignored {push_files}
    bash-check:
      run: bun run bash:lint && bun run bash:format:check
