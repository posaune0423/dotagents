# ===================== Base Config =====================
# ローカルでは ~/.codex/config.toml とマージするか、notify / projects / MCP のパスを環境に合わせて追記してください。

model = "gpt-6-astra"
model_reasoning_effort = "medium"
model_context_window = 872000
model_auto_compact_token_limit = 610000
tool_output_token_limit = 12000
personality = "pragmatic"
web_search = "cached"
suppress_unstable_features_warning = true
plan_mode_reasoning_effort = "high"
oss_provider = "lmstudio"

# ローカルパスを含むためデフォルトは空。必要なら ~/.codex 側で設定。
notify = []

# ===================== Profiles =====================
[profiles.lmstudio]
oss_provider = "lmstudio"

[profiles.lmstudio.features]
apps = false

# ===================== Features =====================
# apps はトップレベルでは `[apps.<name>]` テーブル扱いなので、無効化はフィーチャーフラグ側で行う。
[features]
apps = false
goals = true
browser_use = true
child_agents_md = true
hooks = true
multi_agent = true
multi_agent_v2.enabled = true
multi_agent_v2.min_wait_timeout_ms = 120000
multi_agent_v2.default_wait_timeout_ms = 120000
memories = true
chronicle = true
image_generation = true
in_app_browser = true
js_repl = true
js_repl_tools_only = false
prevent_idle_sleep = true
realtime_conversation = true
remote_control = true
request_permissions_tool = true
runtime_metrics = false
shell_snapshot = true
shell_tool = true
shell_zsh_fork = false
skill_env_var_dependency_prompt = true
skill_mcp_dependency_install = true
tool_call_mcp_elicitation = true
tool_search = true
tool_search_always_defer_mcp_tools = true
tool_suggest = true
unavailable_dummy_tools = true
undo = true
unified_exec = true
workspace_dependencies = true
workspace_owner_usage_nudge = true

[notice]
fast_default_opt_out = true

# ===================== Agents =====================

[agents.explorer]
description = "Built-in exploration role."
config_file = "agents/explorer.toml"

[agents.light-worker]
description = "Light worker for format, lint, typecheck, test, and similar repetitive/simple tasks. Escalate complex or architectural work to impl-worker."
config_file = "agents/light-worker.toml"

[agents.docs-researcher]
description = "Docs researcher role for documentation-backed verification of APIs, version-specific behavior, or framework options."
config_file = "agents/docs-researcher.toml"

[agents.impl-worker]
description = "Implementation worker for one already-specified change: files, intended behavior, and acceptance check are known. Use for parallel independent edits or one large mechanical edit."
config_file = "agents/impl-worker.toml"

[agents.pr-runner]
description = "PR mechanics: open or update a PR, watch CI until green, and apply minimal fixes for review comments. Not for designing or implementing the change."
config_file = "agents/pr-runner.toml"

[agents.reviewer]
description = "Reviewer role for PR-style review focused on correctness, security, behavior regressions, and missing tests."
config_file = "agents/reviewer.toml"

[agents.architect]
description = "Architect role for high-level architectural decisions and design."
config_file = "agents/architect.toml"

[agents.researcher]
description = "Read-only researcher for bounded primary-source, repository, data, or source-conflict evidence lanes."
config_file = "agents/researcher.toml"

[agents.evidence-analyst]
description = "Read-only analyst for causal decomposition, comparison, sensitivity analysis, and alternative hypotheses."
config_file = "agents/evidence-analyst.toml"

[agents.evidence-auditor]
description = "Read-only auditor for evidence support, coverage, source quality, freshness, and scope."
config_file = "agents/evidence-auditor.toml"

# 以下は環境ごとに ~/.codex/config.toml で設定することを想定:
# - [projects."..."] trust_level
# - [mcp_servers.*]（パス依存のもの）
# - [marketplaces.*]（ローカルキャッシュパス）
# - notify（Computer Use バイナリや osascript など）
