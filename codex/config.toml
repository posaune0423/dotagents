# ===================== Base Config =====================
# ローカルでは ~/.codex/config.toml とマージするか、notify / projects / MCP のパスを環境に合わせて追記してください。

model = "gpt-6-astra"
model_reasoning_effort = "medium"
model_context_window = 872000
model_auto_compact_token_limit = 610000
tool_output_token_limit = 12000
suppress_unstable_features_warning = true
plan_mode_reasoning_effort = "high"
oss_provider = "lmstudio"

# ローカルパスを含むためデフォルトは空。必要なら ~/.codex 側で設定。
notify = []

# ===================== Profiles =====================
[profiles.lmstudio]
oss_provider = "lmstudio"

[profiles.lmstudio.features]
apps = false

# ===================== Features =====================
# apps はトップレベルでは `[apps.<name>]` テーブル扱いなので、無効化はフィーチャーフラグ側で行う。
[features]
apps = false
goals = true
browser_use = true
multi_agent_v2.enabled = true
multi_agent_v2.min_wait_timeout_ms = 120000
multi_agent_v2.default_wait_timeout_ms = 120000
memories = true
chronicle = true
image_generation = true
in_app_browser = true
prevent_idle_sleep = true
request_permissions_tool = true
runtime_metrics = false
shell_snapshot = true
shell_tool = true
skill_mcp_dependency_install = true
tool_call_mcp_elicitation = true
tool_suggest = true
unified_exec = true
workspace_dependencies = true

[notice]
fast_default_opt_out = true


# 以下は環境ごとに ~/.codex/config.toml で設定することを想定:
# - [projects."..."] trust_level
# - [mcp_servers.*]（パス依存のもの）
# - [marketplaces.*]（ローカルキャッシュパス）
# - notify（Computer Use バイナリや osascript など）
