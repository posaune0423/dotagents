# Use-case profiles: name|capability|provider[=model],provider[=model],...
#
# A profile answers "which model for this kind of work" once, so a caller never
# has to carry provider-specific model ids. Entries are tried in order and the
# normal availability fallback applies within a profile.
#
# `=` separates provider from model because model ids contain colons and
# slashes. A bare provider name uses that provider's own default, which is the
# right choice for Cursor: its Free plan rejects every named model and only
# routes Auto.
#
# Model ids verified against the live CLIs on 2026-09-14. Rosters change; run
# `piggyback.sh --probe` after editing, which checks defaults against the
# provider's live model list without spending a request.

# Mechanical text work: triage, extraction, reformatting. Cheapest and fastest
# first, and the largest allowances are here (groq ~1,000/day).
fast|inference|groq=openai/gpt-oss-20b,mistral=ministral-8b-latest,openrouter,antigravity=gemini-3.8-flash-low

# Analysis worth a stronger model: reading a diff for real problems, weighing
# alternatives. Antigravity is the only free tier exposing frontier models.
reasoning|inference|antigravity=claude-opus-4-6-thinking,antigravity=gemini-3.1-pro-high,groq=openai/gpt-oss-120b

# Inputs that do not fit a small context. Both entries are 1M-token models.
long-context|inference|antigravity=gemini-3.1-pro-high,antigravity=gemini-3.8-flash-high

# Writing code. Needs a provider that can read the workspace and run commands.
code|agentic|antigravity=gemini-3.8-flash-high,cursor,copilot

# Judgement over code: review, design critique. Slower and stronger than `code`.
review|agentic|antigravity=claude-opus-4-6-thinking,cursor
